name: Marginalia CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contracts:
    name: Contracts, SDK, services, security and gas guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22: the browser-SDK parity tests run TypeScript directly (--experimental-strip-types)
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install frontend dependencies (needed by the SDK parity tests)
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile smart contracts & verification interfaces
        env:
          USE_SOLCJS: "1"
        run: npx hardhat compile

      # Includes: unit + invariant tests, on-chain security tests (test/security_onchain.test.js),
      # gas regression guard (test/gas_benchmark.test.js, fails above baseline + 2%),
      # Magistrate service, IPFS store and browser-SDK parity tests. No .env and no network needed.
      - name: Run the full test suite
        env:
          USE_SOLCJS: "1"
        run: npx hardhat test

      - name: Dependency audit (production, root)
        run: npm audit --omit=dev

  frontend:
    name: Frontend type-check, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Dependency audit (production)
        run: npm audit --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed private keys or service tokens
        run: |
          set -e
          if git grep -nE "(PRIVATE_KEY|SERVICE_ROLE_KEY|PINATA_JWT)\s*=\s*['\"]?(0x[0-9a-fA-F]{64}|eyJ[A-Za-z0-9._-]{30,})" -- . ':!*.md' ':!.env.example' ':!frontend/.env.example'; then
            echo "Possible committed secret found"; exit 1
          fi
          if git grep -nE "alch_[A-Za-z0-9_-]{20,}" -- . ':!*.md'; then
            echo "Possible committed RPC key found"; exit 1
          fi
          echo "no secrets found"
