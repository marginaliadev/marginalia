name: Marginalia CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Invariant Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile smart contracts & verification interfaces
        env:
          USE_SOLCJS: "1"
        run: npx hardhat compile

      - name: Execute Marginalia cryptographic & invariant tests
        env:
          USE_SOLCJS: "1"
        run: npx hardhat test test/marginalia.test.js
